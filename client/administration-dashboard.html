<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="admin-header">
        <h1>Administration Portal</h1>
        <p class="admin-subtitle">Manage attendance records and member information.</p>
    </div>

    <div class="admin-grid">
        <div class="admin-card" id="attendance-card">
            <div class="admin-icon">📋</div>
            <h2>Attendance Records</h2>
            <p>View attendance, edit records, access statistics and download reports.</p>
        </div>

        <div class="admin-card" id="members-card">
            <div class="admin-icon">👥</div>
            <h2>Member Profiles</h2>
            <p>Manage member information, birthdays and attendance history.</p>
        </div>
    </div>

    <div class="logout-container">
        <button id="logout-btn">Logout</button>
    </div>

    <script src="js-scripts/administration-dashboard.js"></script>

</body>
</html>
