<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Attendance</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <header class="mobile-header">
        <button id="menu-btn">☰</button>
        <h3 class="mobile-title">✦ First Love Church</h3>
    </header>

    <nav id="mobile-nav">
        <ul>
            <li><a href="index.html">🏠 Home</a></li>

            <li><a href="profile.html">👥 Member Profiles</a></li>
            <li><a href="administration.html">⚙️ Admin</a></li>
        </ul>
    </nav>

    <h1>Attendance Check-In</h1>

    <h2 id="branch-name"></h2>
    <p class="gold-text">Please fill out your attendance information below.</p>

    <form class="attendance-container" onsubmit="return false;">

        <label for="first-name">First Name</label>
        <div class="name-search-container">
            <input id="first-name" type="text" placeholder="John" required>
            <div id="name-suggestions"></div>
        </div>

        <label for="last-name">Last Name</label>
        <div class="name-search-container">
            <input id="last-name" type="text" placeholder="Doe" required>
        </div>
        
        <p>Are you a <span class="bold">first timer?</span></p>
        <div class="radio-group">
            <label>
                <input type="radio" name="first-timer" value="yes" required>
                Yes
            </label>
            <label>
                <input type="radio" name="first-timer" value="no">
                No
            </label>
        </div>

        <button id="submit-btn" type="submit">Submit</button>

        <p id="response-message"></p>
    </form>

    <div class="ownership-bar">
        <span>© 2026 First Love Church Atlanta. All Rights Reserved.</span>
        <span>pamelakyei15@gmail.com</span>
    </div>

    <script src="../js-scripts/attendance.js"></script>
</body>
</html>
