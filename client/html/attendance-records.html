<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Attendance Records</title>

    <link rel="stylesheet" href="../css/style.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>

</head>
<body>
    <nav>
        <ul>
            <li><a href="administration-dashboard.html"><span class="gold-text">✦ First Love Church</span></a></li>
            <li><a href="administration-dashboard.html">⚙️ Dashboard</a></li>
        </ul>
    </nav>

    <h1>Attendance Records</h1>

    <div class="stats-container">
        <div class="stat-card">
            <h3>Total Attendance</h3>
            <p id="total-attendance">0</p>
        </div>

        <div class="stat-card">
            <h3>First Timers</h3>
            <p id="first-timers">0</p>
        </div>

        <div class="stat-card">
            <h3>Returnees</h3>
            <p id="returning-members">0</p>
        </div>
    </div>

    <div class="filter-container">
        <label for="date-filter">Date</label>
        <input type="date" id="date-filter">
        <label for="branch-filter">Filter By Branch</label>
        <select id="branch-filter">
            <option value="all">All Branches</option>
        </select>
    </div>

    <div class="table-container">
        <table id="attendance-table">
            <thead>
                <tr>
                    <th>First Name</th>
                    <th>Last Name</th>
                    <th>Branch</th>
                    <th>First Timer</th>
                    <th>Date</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody id="attendance-body"></tbody>
        </table>
    </div>

    <div class="button-container">
        <button id="download-btn">Download Attendance Report</button>
        <button id="back-btn">Back to Admin Portal</button>
    </div>

    <div id="edit-modal" class="edit-modal">
        <div class="edit-modal-content">
            <h2>Edit Attendance Record</h2>
            <label for="edit-first-name">First Name</label>
            <input id="edit-first-name" type="text">
            
            <label for="edit-last-name">Last Name</label>
            <input id="edit-last-name" type="text">
            
            <label for="edit-branch">Branch</label>
            <input id="edit-branch" type="text">
            
            <label for="edit-first-timer">First Timer</label>
            <select id="edit-first-timer">
                <option value="yes">Yes</option>
                <option value="no">No</option>
            </select>

            <div class="modal-buttons">
                <button id="cancel-edit">Cancel</button>
                <button id="save-edit">Save Changes</button>
            </div>
        </div>
    </div>

    <div id="delete-modal" class="edit-modal">
        <div class="edit-modal-content">
            <h2>Delete Record</h2>
            <p id="delete-message"></p>

            <div class="modal-buttons">
                <button id="cancel-delete">Cancel</button>
                <button id="confirm-delete">Delete</button>
            </div>
        </div>
    </div>

    <script src="../js-scripts/attendance-records.js"></script>
</body>
</html>
